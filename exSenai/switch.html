<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const perfil = prompt("Qual o perfil do aluno")
        switch(perfil){
            case "admin":
                console.log("PERFIL ADMINISTRATIVO");
                break;
            case "user":
                console.log("PERFIL USUÁRIO");
                break;
            default:
                console.log("PERFIL NÃO EXISTENTE")
        }
    </script>
</body>
</html>
