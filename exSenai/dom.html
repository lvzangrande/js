<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo DOM</title>
</head>
<body>
    <h2 id="titulo">Aprendendo o DOM</h2>
    
    <p id="paragrafo01">Manipulando elemento com JavaScript</p>
    <p id="paragrafo02">Depois dos fundamentos, iremos testar API</p>

    <img src="https://placehold.co/600x400" id="imgIlustrativa">

    <button id="botaoTop" type="button">TESTE</button>
    
    <div class="oculto modal" id="modal">
        <h2>titulo da modal</h2>
        <p>DESCRIÇÃO</p>
        <h1 id="contador"></h1>
        <button type="button" id="close">Fechar</button>
    </div>

    <style>
        .chamativo{
            background-color: red;
            color: white;
            font: arial 10px bold;
        }
        .oculto{
            display: none;
            visibility: hidden;
        }
        .visivel{
            display: block;
            visibility: visible;
        }

        .modal{
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            padding: 20px;
            background-color: #333;
            color: white;
            border: none;
        }
    </style>
    <script>
        const paragrafo = document.querySelector("p#paragrafo02");
        console.log(paragrafo);
        
        const nome = prompt("Qual o seu nome")
        if(nome == "admin"){
            paragrafo.innerText = "Eu sou o root";
            paragrafo.classList.add("chamativo");
        }
        else{
            paragrafo.innerText = "Eu sou mortal";
        }
        
        let contador = 0;
        
        const modal = document.querySelector('#modal');
        function abrirModal(){
            contador++
            document.querySelector('#contador').innerHTML = contador
            modal.classList.remove('oculto');
            modal.classList.add('visivel');

        }

        function fecharModal(){
            modal.classList.remove('visivel');
            modal.classList.add('oculto');
        }

        const botao = document.querySelector("#botaoTop");
        botao.addEventListener('click',abrirModal)

        const fechar = document.querySelector("#close");
        fechar.addEventListener('click',fecharModal);
    </script>
</body>
</html>
